# Representa un document adjunt (acta, convocatoria...) associat a una
# activitat de tipus Junta/Assemblea (vegeu memoria, CU-12). Nomes s'exposen
# aqui els documents amb usage=ATTACHMENT; les imatges (MAIN_IMAGE/
# SECONDARY_IMAGE) es continuen exposant com als camps escalars existents
# (mainImage/secondaryImage).
type ActivityDocument {
  id: ID!
  name: String!
  url: String!
  type: String!
  createdAt: String!
}

type Activity {
  id: ID!
  title: String!
  shortDescription: String!
  longDescription: String!
  createdAt: String!
  publishedAt: String
  status: String
  type: String
  activityDate: String!
  registrationStartDate: String
  registrationEndDate: String
  capacity: Int
  mainImage: String
  secondaryImage: String
  slug: String!
  isPrivate: Boolean!
  
  author: User!
  section: Section!
  participants: [User!]! # Llista d'usuaris inscrits
  documents: [ActivityDocument!]! # Adjunts (actes, convocatories...)

  # Camps calculats al resolver a partir de `participants` i `capacity`.
  # Permeten mostrar l'ocupacio al portal public sense haver de descarregar
  # la llista sencera d'inscrits (dades personals de tercers).
  enrolledCount: Int!        # Nombre d'usuaris inscrits actualment
  availableSpots: Int        # Places lliures; null si l'activitat no te aforament
  isFull: Boolean!           # Cert si s'ha exhaurit l'aforament
  isEnrollmentOpen: Boolean! # Cert si avui som dins del periode d'inscripcio
}

# Fitxer ja pujat via l'endpoint REST POST /upload (vegeu memoria, 9.4.2):
# el frontend primer puja el binari a MinIO i despres nomes envia aqui la
# referencia (nom, url i tipus MIME retornats per aquell endpoint).
input AttachmentInput {
  name: String!
  url: String!
  type: String!
}

input CreateActivityInput {
  title: String!
  shortDescription: String!
  longDescription: String!
  status: String
  type: String
  isPrivate: Boolean
  activityDate: String!
  registrationStartDate: String
  registrationEndDate: String
  capacity: Int
  mainImage: String
  secondaryImage: String
  sectionId: Int!
  attachments: [AttachmentInput!] # Nous adjunts a afegir (creacio i edicio)
  removeDocumentIds: [ID!] # Adjunts existents a eliminar (nomes te sentit en edicio)
}

input ActivityFilterInput {
  title: String
  sectionId: ID
  authorId: ID
  location: String
  status: String
  type: String
  types: [String!]
}

input SortInput {
  field: String
  direction: String # "ASC", "DESC"
}

type PaginatedActivities {
  items: [Activity!]!
  totalCount: Int!
}

extend type Query {
  getAllActivities: [Activity!]!
  getActivityBySlug(slug: String!): Activity
  getActivityById(id: ID!): Activity
  getFilteredActivities(
    filter: ActivityFilterInput
    sort: SortInput
    page: Int
    limit: Int
  ): PaginatedActivities
  # RF-2.3 / CU-06: llistat de les activitats en que l'usuari autenticat
  # actual esta inscrit.
  getMyActivities: [Activity!]!
}

extend type Mutation {
  createActivity(input: CreateActivityInput!): Activity
  updateActivity(id: ID!, input: CreateActivityInput!): Activity
  # RF-2.2 / CU-05: el soci s'inscriu ell mateix (l'usuari surt del token).
  enrollInActivity(activityId: ID!): Boolean!
  # RF-2.2: el soci anul·la la seva propia inscripcio.
  unenrollFromActivity(activityId: ID!): Boolean!
  # RF-3.3: l'administrador gestiona les inscripcions de qualsevol soci.
  addParticipantToActivity(activityId: ID!, userId: ID!): Boolean!
  removeParticipantFromActivity(activityId: ID!, userId: ID!): Boolean!
}