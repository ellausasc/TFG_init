type Activity {
  activity_id: Int!
  title: String!
  short_descr: String!
  sections: [String!]!
  creation_date: String!
  publication_date: String!
  activity_date: String!
  begin_inscription_date: String!
  end_inscription_date: String!
  public: Boolean!
  image: Image!
  slug: String!
}

extend type Query {
  getAllActivities: [Activity!]!
  getActivityBySlug(slug: String!): Activity
}