# Definición de la entidad Section
type Section {
  id: ID!
  name: String!
  description: String
  createdAt: String!
  publishedAt: String
  isActive: Boolean!

  mainNews: News
  
  # Relaciones (GraphQL pedirá estos datos a Prisma cuando el frontend los solicite)
  news: [News!]!
  activities: [Activity!]!
  roles: [Role!]!
}

# Input para CREAR una sección nueva
# Solo pedimos lo esencial. El ID y el createdAt los genera la BBDD automáticamente.
input CreateSectionInput {
  name: String!
  description: String
  isActive: Boolean
  publishedAt: String
  mainNews: CreateSectionMainNewsInput!
}

input CreateSectionMainNewsInput {
  title: String!
  shortDescription: String!
  longDescription: String!
  status: String
  type: String
  mainImage: String
  secondaryImage: String
  tagIds: [Int!]
}

# Input para MODIFICAR una sección existente
# Todos los campos son opcionales para permitir actualizaciones parciales
input UpdateSectionInput {
  name: String
  description: String
  isActive: Boolean
  publishedAt: String
  mainNewsid: Int
}

# Consultas (Queries)
extend type Query {
  getAllSections: [Section!]!
  getSectionById(id: ID!): Section
}

# Modificaciones (Mutations)
extend type Mutation {
  createSection(input: CreateSectionInput!): Section!
  updateSection(id: ID!, input: UpdateSectionInput!): Section!
}